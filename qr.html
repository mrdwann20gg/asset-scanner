<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDIVET PDHB drh Cucu Sunter - Asset Management</title>
<style>
body{margin:0;padding:40px 20px;font-family:Arial,sans-serif;background:#f3f6fb;color:#1f2937;text-align:center}
.card{max-width:400px;margin:auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{color:#1d4ed8;font-size:20px;margin:0 0 8px}
p{color:#64748b;font-size:14px;margin:0 0 20px}
.spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
a{display:inline-block;margin-top:16px;padding:10px 18px;background:#4f46e5;color:#fff;text-decoration:none;border-radius:8px;font-size:13px;font-weight:600}
.error{padding:12px;background:#fee2e2;color:#b91c1c;border-radius:8px;font-size:13px}
</style>
</head>
<body>

<div class="card">
<h1>MEDIVET Asset</h1>
<p id="status">Mengarahkan ke detail asset...</p>
<div class="spinner" id="spinner"></div>
<div id="error" class="error" style="display:none;"></div>
<a id="manualLink" href="#" style="display:none;">Klik di sini kalau tidak redirect otomatis</a>
</div>

<script>
// === GANTI URL INI dengan URL /exec lo ===
const WEB_APP_URL = 'https://script.google.com/macros/s/[ID-DEPLOYMENT-LO]/exec';

(function() {
  const params = new URLSearchParams(window.location.search);
  const kode = params.get('id') || params.get('kode');

  if (!kode) {
    document.getElementById('status').textContent = 'Kode asset tidak ditemukan.';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('error').textContent = 'QR tidak valid: parameter "id" tidak ada.';
    document.getElementById('error').style.display = 'block';
    return;
  }

  const targetUrl = WEB_APP_URL + '?kode=' + encodeURIComponent(kode);

  const manualLink = document.getElementById('manualLink');
  manualLink.href = targetUrl;
  manualLink.style.display = 'inline-block';

  setTimeout(function() {
    window.location.replace(targetUrl);
  }, 300);
})();
</script>

</body>
</html>
