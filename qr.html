<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEDIVET QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f3f6fb; color: #1f2937; }
    .container { max-width: 600px; margin: auto; }
    .card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 8px 30px #00000012; }
    h1 { margin-top: 0; color: #1d4ed8; }
    .subtitle { color: #64748b; margin-bottom: 20px; }
    #reader { width: 100%; overflow: hidden; border-radius: 14px; }
    .result { margin-top: 20px; padding: 16px; border-radius: 12px; background: #eff6ff; color: #1e40af; overflow-wrap: anywhere; }
    .button { display: inline-block; margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; text-decoration: none; }
    .button:hover { background: #1d4ed8; }
    .footer { margin-top: 24px; text-align: center; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>QR Asset Scanner</h1>
      <div class="subtitle">Arahkan kamera ke QR Code aset MEDIVET</div>
      <div id="reader"></div>
      <div id="result" class="result">Menunggu pemindaian QR Code...</div>
      <a id="detailButton" class="button" href="#" style="display:none;">Lihat Detail Asset</a>
    </div>
    <div class="footer">MEDIVET Asset Management</div>
  </div>

  <script>
    let scanner = null;
    let scanned = false;

    const result = document.getElementById('result');
    const detailButton = document.getElementById('detailButton');

    function onScanSuccess(decodedText) {
      if (scanned) return;
      scanned = true;

      result.textContent = 'QR Code berhasil dipindai: ' + decodedText;

      let detailUrl = decodedText;

      try {
        const url = new URL(decodedText);
        detailUrl = url.href;
      } catch (error) {
        result.textContent = 'QR Code terbaca, tetapi format URL tidak valid: ' + decodedText;
        scanned = false;
        return;
      }

      detailButton.href = detailUrl;
      detailButton.style.display = 'inline-block';

      if (scanner) {
        scanner.clear().catch(function(error) {
          console.log('Kamera tidak dapat dihentikan:', error);
        });
      }

      setTimeout(function() {
        window.location.href = detailUrl;
      }, 800);
    }

    function onScanError(errorMessage) {
      // Abaikan error per frame
    }

    function startScanner() {
      scanner = new Html5QrcodeScanner(
        "reader",
        { fps: 10, qrbox: { width: 250, height: 250 } },
        false
      );
      scanner.render(onScanSuccess, onScanError);
    }

    window.addEventListener('load', startScanner);
  </script>
</body>
</html>
