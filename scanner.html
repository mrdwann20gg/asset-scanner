<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MEDIVET - Scan QR Asset</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .page {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 25px 16px 40px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
    }

    .brand-subtitle {
      margin-top: 5px;
      font-size: 11px;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #6b7280;
    }

    .title {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin: 18px 0 8px;
    }

    .info {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }

    #reader__dashboard {
      padding: 10px !important;
    }

    #reader__dashboard button {
      border: 0 !important;
      border-radius: 8px !important;
      padding: 9px 13px !important;
      background: #4f46e5 !important;
      color: #ffffff !important;
      cursor: pointer;
      margin: 3px;
    }

    #reader__dashboard select {
      padding: 8px !important;
      border-radius: 7px !important;
      border: 1px solid #d1d5db !important;
    }

    .status {
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 9px;
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
      text-align: center;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .success {
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .back {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 11px 14px;
      border: 0;
      border-radius: 9px;
      background: #f3f4f6;
      color: #374151;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <div class="brand">
        <div class="brand-title">
          MEDIVET PDHB drh Cucu Sunter
        </div>

        <div class="brand-subtitle">
          ASSET MANAGEMENT
        </div>
      </div>

      <div class="title">
        Scan QR Asset
      </div>

      <div class="info">
        Izinkan akses kamera jika browser meminta izin,
        kemudian arahkan kamera ke QR Code asset.
      </div>

      <div id="reader"></div>

      <div id="status" class="status">
        Menyiapkan kamera...
      </div>

      <button
        type="button"
        class="back"
        onclick="window.close()"
      >
        Tutup Scanner
      </button>

    </div>

  </div>

<script>
  let scanner = null;
  let processing = false;

  const params =
    new URLSearchParams(
      window.location.search
    );

  const returnUrl =
    params.get('return') || '';

  function setStatus(
    message,
    type
  ) {

    const box =
      document.getElementById('status');

    if (!box) return;

    box.textContent =
      message;

    box.className =
      'status' +
      (type ? ' ' + type : '');
  }


  function extractKode(decodedText) {

    if (!decodedText) {
      return '';
    }

    const text =
      String(decodedText).trim();

    // QR berisi URL aplikasi.
    try {

      const url =
        new URL(text);

      const kode =
        url.searchParams.get('kode') ||
        url.searchParams.get('id');

      if (kode) {
        return decodeURIComponent(
          kode
        ).trim();
      }

    } catch (e) {
      // Bukan URL.
    }

    // QR langsung berisi kode asset.
    if (
      /^[A-Za-z0-9]+-[A-Za-z0-9]+-[A-Za-z0-9]+$/
        .test(text)
    ) {
      return text;
    }

    // Cari kode di dalam teks tambahan.
    const match =
      text.match(
        /[A-Za-z0-9]+-[A-Za-z0-9]+-[A-Za-z0-9]+/
      );

    return match
      ? match[0]
      : '';
  }


  function openAssetDetail(
    decodedText
  ) {

    if (processing) {
      return;
    }

    processing = true;

    const kode =
      extractKode(decodedText);

    if (!kode) {

      processing = false;

      setStatus(
        'QR terbaca, tetapi Kode Asset tidak ditemukan.',
        'error'
      );

      return;
    }

    setStatus(
      'QR berhasil dibaca: ' +
      kode +
      '. Membuka detail asset...',
      'success'
    );

    if (!returnUrl) {

      setStatus(
        'URL kembali ke Asset Management tidak ditemukan.',
        'error'
      );

      return;
    }

    const detailUrl =
      returnUrl +
      '?kode=' +
      encodeURIComponent(kode);

    if (scanner) {

      scanner
        .stop()
        .catch(function() {})
        .finally(function() {

          window.location.href =
            detailUrl;

        });

    } else {

      window.location.href =
        detailUrl;
    }
  }


  function startScanner() {

    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      setStatus(
        'Library scanner belum berhasil dimuat. Periksa koneksi internet.',
        'error'
      );

      return;
    }

    scanner =
      new Html5Qrcode('reader');

    const config = {
      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );

        return {
          width: size,
          height: size
        };
      },

      aspectRatio: 1.0,

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    };

    scanner
      .start(
        {
          facingMode: {
            ideal: 'environment'
          }
        },
        config,
        function(decodedText) {

          openAssetDetail(
            decodedText
          );

        },
        function() {
          // Tidak menampilkan error setiap frame.
        }
      )
      .then(function() {

        setStatus(
          'Kamera aktif. Arahkan kamera ke QR Code asset.'
        );

      })
      .catch(function(error) {

        console.error(
          'Camera error:',
          error
        );

        setStatus(
          'Kamera tidak dapat dibuka. ' +
          'Pastikan izin kamera browser diizinkan.',
          'error'
        );
      });
  }


  window.addEventListener(
    'load',
    function() {

      // Scanner dimulai otomatis setelah halaman eksternal dibuka.
      startScanner();

    }
  );
</script>

</body>
</html>
