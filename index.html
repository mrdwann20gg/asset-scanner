
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR - MEDIVET Asset Management</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f7fb;font-family:Arial,sans-serif;color:#1f2937;min-height:100vh;display:flex;justify-content:center;align-items:center}.card{width:100%;max-width:520px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 10px 30px #00000014}.header{text-align:center}.brand{font-size:18px;font-weight:700}.subtitle{font-size:11px;letter-spacing:1px;font-weight:700;color:#6b7280;margin-top:5px}.title{font-size:21px;font-weight:700;margin-top:22px}.description{font-size:13px;line-height:1.6;color:#6b7280;margin-top:7px}button{border:0;border-radius:9px;padding:12px 16px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer;margin-top:18px;width:100%}button:disabled{opacity:.6}#reader{width:100%;margin-top:18px;overflow:hidden;border-radius:12px}.status{margin-top:15px;padding:12px;border-radius:9px;background:#f3f4f6;text-align:center;font-size:13px;line-height:1.5}.success{background:#ecfdf5;color:#166534}.error{background:#fef2f2;color:#991b1b}.warning{background:#fffbeb;color:#92400e}.back{background:#6b7280}.result{display:none;margin-top:15px;padding:12px;border-radius:9px;background:#eff6ff;color:#1e40af;word-break:break-word}
</style>
</head>
<body>
<div class="card">
<div class="header"><div class="brand">MEDIVET PDHB drh Cucu Sunter</div><div class="subtitle">ASSET MANAGEMENT</div><div class="title">Scan QR Asset</div><div class="description">Arahkan kamera ke QR Code asset untuk membuka detail asset.</div></div>
<button id="startBtn" type="button">Aktifkan Kamera</button>
<div id="reader"></div>
<div id="status" class="status">Tekan tombol Aktifkan Kamera untuk memulai.</div>
<div id="result" class="result"></div>
<button class="back" id="backBtn" type="button">← Kembali ke Asset Management</button>
</div>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search);
const returnUrl=params.get('return')||'';
const statusBox=document.getElementById('status');
const startBtn=document.getElementById('startBtn');
const resultBox=document.getElementById('result');
let scanner=null, running=false, processed=false;
function status(msg,type){statusBox.textContent=msg;statusBox.className='status'+(type?' '+type:'')}
function extractCode(text){
  try{const u=new URL(text);return u.searchParams.get('kode')||u.searchParams.get('kodeAsset')||u.searchParams.get('id')||text}catch(e){return text}
}
function onSuccess(text){
 if(processed)return;processed=true;
 const code=extractCode(String(text||'').trim());
 resultBox.style.display='block';resultBox.textContent='QR terbaca: '+code;
 status('QR berhasil dibaca. Membuka detail asset...','success');
 stop();
 if(/^https?:\/\//i.test(String(text).trim())){location.href=String(text).trim();return;}
 if(returnUrl){const sep=returnUrl.includes('?')?'&':'?';location.href=returnUrl+sep+'kode='+encodeURIComponent(code);}
 else{resultBox.textContent='Kode asset: '+code;}
}
function start(){
 if(running)return;
 if(typeof Html5Qrcode==='undefined'){status('Library scanner gagal dimuat. Periksa koneksi internet lalu muat ulang.','error');return;}
 running=true;processed=false;startBtn.disabled=true;status('Meminta akses kamera...','warning');
 if(!window.isSecureContext)throw new Error('Halaman kamera harus dibuka melalui HTTPS.');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Akses kamera tidak tersedia. Pastikan menggunakan Chrome/Edge melalui HTTPS dan izin kamera tidak diblokir.');
  scanner=new Html5Qrcode('reader');
  const config={fps:10,qrbox:{width:250,height:250},aspectRatio:1.0};
  scanner.start({facingMode:{exact:'environment'}},config,onSuccess,()=>{})
  .catch(()=>scanner.start({facingMode:'user'},config,onSuccess,()=>{}))
  .then(()=>{status('Kamera aktif. Arahkan kamera ke QR Code asset.','success');startBtn.style.display='none';})
 .catch(err=>{console.error(err);running=false;startBtn.disabled=false;status('Kamera tidak dapat digunakan: '+(err&&err.message?err.message:String(err)),'error');});
}
function stop(){if(scanner&&running){scanner.stop().catch(()=>{}).finally(()=>{running=false;});}}
startBtn.addEventListener('click',start);
document.getElementById('backBtn').addEventListener('click',()=>{stop();if(returnUrl)location.href=returnUrl;else history.back();});
window.addEventListener('pagehide',stop);
})();
</script>
</body>
</html>
